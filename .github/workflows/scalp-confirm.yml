name: 开盘承接确认推送 (09:35)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  push-scalp-confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pyyaml
      - name: Run scalp confirm push
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python scalp_push.py --stage confirm
      - name: Commit and push daily push records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/scalp_records/
          git diff --staged --quiet || (git commit -m "chore(scalp): save 09:35 confirm push records [skip ci]" && git push origin main)

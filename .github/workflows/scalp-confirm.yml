name: 弱转强反包冲板 (09:40:00)

on:
  schedule:
    - cron: '40 1 * * 1-5'  # UTC 01:40 = 北京时间 09:40 (周一至周五)
  workflow_dispatch:
    inputs:
      demo:
        description: '演示模式测试（勾选后可随时在非交易时间/晚上测试推送）'
        required: false
        default: false
        type: boolean

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  push-scalp-confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pyyaml
      - name: Run scalp confirm push
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          if [ "${{ inputs.demo }}" = "true" ]; then
            echo "🚀 运行演示测试模式 (--demo)"
            python scalp_push.py --stage confirm --demo
          else
            python scalp_push.py --stage confirm
          fi
      - name: Commit and push daily records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/scalp_records/ data/scalp_account.json
          git diff --staged --quiet || (git commit -m "chore(scalp): save 09:40 confirm push & account [skip ci]" && git push origin main)

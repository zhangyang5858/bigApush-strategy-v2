name: 早盘定势封板推送 (09:55)

on:
  schedule:
    - cron: '55 1 * * 1-5'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  push-scalp-settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pyyaml
      - name: Run scalp settle push
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python scalp_push.py --stage settle

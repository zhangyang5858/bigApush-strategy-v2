name: 短线决策每日收盘复盘 (15:30)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  push-scalp-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pyyaml
      - name: Run daily scalp review push
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python scalp_review_push.py
      - name: Commit and push review report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/scalp_records/
          git diff --staged --quiet || (git commit -m "chore(scalp): save 15:30 review report [skip ci]" && git push origin main)

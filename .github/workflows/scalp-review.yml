name: 短线决策每日收盘复盘 (15:30)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  push-scalp-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pyyaml
      - name: Run daily scalp review push
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python scalp_review_push.py
